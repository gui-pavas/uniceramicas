name: uniceramicas

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.uniceramicas.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.uniceramicas.entrypoints=websecure
      - traefik.http.routers.uniceramicas.tls=true
      - traefik.http.routers.uniceramicas.tls.certresolver=letsencrypt
      - traefik.http.services.uniceramicas.loadbalancer.server.port=80

networks:
  proxy:
    external: true
